name: Synthetic CPU Baseline (Not DeepSeek-OCR2)
on:
  push:
    branches:
      - experiment/deepseek-ocr2-synthetic
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-cpu.txt'
      - '.github/workflows/synthetic-cpu.yml'
jobs:
  synthetic-cpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ara
      - run: python -m pip install -r requirements-cpu.txt
      - run: python scripts/create_synthetic_pdfs.py
      - run: PYTHONPATH=. python -m src.pilot --engine hybrid --samples samples --output results/hybrid.json
      - run: PYTHONPATH=. python -m pytest -q
