name: MDIA Arabic OCR comma candidate - 300 invoice non-regression
on:
  pull_request:
    paths:
      - 'mdia/textutil.py'
      - 'mdia/extract.py'
      - 'tests/test_arabic_comma_ocr_review.py'
      - '.github/workflows/mdia-arabic-comma-300.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-ocr-300:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      MDIA_PADDLE_WORD_ALIGN: '0'
      MDIA_EVIDENCE_RECONCILIATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local OCR and Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng fonts-dejavu-core fonts-hosny-amiri
          python -m pip install -r requirements.txt
          python -m pip install 'paddlepaddle==3.2.0' 'paddleocr>=3.2,<4'
      - name: Full regression and Arabic OCR candidate safety tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -q
          python -m mdia.doctor
      - name: Run unchanged 300 invoice synthetic generator with candidate code
        run: |
          python -u -m scripts.benchmark_invoice300 \
            --shard ${{ matrix.shard }} --shards 6 \
            --engines paddle_arabic \
            --output-dir results/arabic_comma_shard${{ matrix.shard }}
      - name: Assert full real OCR and no runtime failures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(next(Path("results").glob("arabic_comma_shard*/results.json")).read_text("utf-8"))
          assert r["status"] == "completed_real_ocr" and len(r["results"]) == 50
          assert r["summary"]["paddle_arabic"]["failures"] == 0
          assert all(x["real_paddle_detected"] for x in r["results"])
          print("REAL PADDLEOCR",r["shard"],r["summary"]["paddle_arabic"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdia-comma-shard${{ matrix.shard }}
          path: results/arabic_comma_shard${{ matrix.shard }}/results.json
          retention-days: 7
          if-no-files-found: error
  strict-300-acceptance:
    needs: real-ocr-300
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mdia-comma-shard*
          path: acceptance-shards
      - name: Fail closed unless all original correct fields and rows preserved
        run: |
          python -m scripts.check_invoice300_acceptance acceptance-shards/*/results.json
