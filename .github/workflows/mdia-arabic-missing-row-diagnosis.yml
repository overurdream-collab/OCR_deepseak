name: MDIA Arabic missing-row source diagnosis
on:
  pull_request:
    paths:
      - '.github/workflows/mdia-arabic-missing-row-diagnosis.yml'
      - 'mdia/tables.py'
      - 'tests/test_arabic_missing_rows.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  missing-row-ocr-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      MDIA_PADDLE_WORD_ALIGN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local Arabic OCR and Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng fonts-dejavu-core fonts-hosny-amiri
          python -m pip install -r requirements.txt
          python -m pip install 'paddlepaddle==3.2.0' 'paddleocr>=3.2,<4'
      - name: Capture raw words and field misses for 3 known headerless cases
        run: |
          python -u -m scripts.diagnose_arabic_decimal_ocr \
            --cases ar_shaped_18 ar_mixed_18 ar_visual_48 \
            --output results/missing_rows_source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdia-missing-rows-raw-synthetic
          path: results/missing_rows_source.json
          retention-days: 7
          if-no-files-found: error
