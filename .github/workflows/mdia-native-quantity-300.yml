name: MDIA independent native-PDF quantity recovery - 300
on:
  pull_request:
    paths:
      - 'mdia/native_quantity.py'
      - 'mdia/pipeline.py'
      - 'tests/test_native_quantity.py'
      - '.github/workflows/mdia-native-quantity-300.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-source-not-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original PDF text extractor
        run: python -m pip install 'pdfplumber>=0.11,<1'
      - name: Test original text layer proof and no arithmetic guesses
        run: |
          python -m unittest tests.test_native_quantity tests.test_zero_error_acceptance -v
  full-paddle:
    needs: verify-source-not-inference
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      MDIA_PADDLE_WORD_ALIGN: '0'
      MDIA_EVIDENCE_RECONCILIATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline OCR and Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng fonts-dejavu-core fonts-hosny-amiri
          python -m pip install -r requirements.txt
          python -m pip install 'paddlepaddle==3.2.0' 'paddleocr>=3.2,<4'
      - name: Verify 50 frozen synthetic PDF files with independent native text reading
        run: |
          python -u -m scripts.benchmark_invoice300 \
            --shard ${{ matrix.shard }} --shards 6 \
            --engines paddle_arabic --output-dir results/native_source_shard${{ matrix.shard }}
      - name: Require real model, all documents, all original pages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(next(Path("results").glob("native_source_shard*/results.json")).read_text("utf-8"))
          assert r["status"]=="completed_real_ocr" and len(r["results"])==50
          assert not r["failure_records"]
          assert all(x["real_paddle_detected"] for x in r["results"])
          print(r["shard"],r["summary"]["paddle_arabic"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdia-native-source-shard${{ matrix.shard }}
          path: results/native_source_shard${{ matrix.shard }}/results.json
          retention-days: 7
          if-no-files-found: error
  exact-field-comparison:
    needs: full-paddle
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mdia-native-source-shard*
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          run-id: 40786930681
          github-token: ${{ github.token }}
          pattern: mdia-spacing-shard*
          path: baseline
      - name: Reject missing evidence, any lost correct field, or false new service row
        run: |
          python -m scripts.compare_ambiguous_rows300 \
            --previous baseline/*/results.json \
            --current candidate/*/results.json \
            --output results/native_source_fieldwise.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdia-native-source-fieldwise-proof
          path: results/native_source_fieldwise.json
          retention-days: 14
          if-no-files-found: warn
