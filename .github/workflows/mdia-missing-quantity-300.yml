name: MDIA recover OCR quantities - 300 frozen invoices
on:
  pull_request:
    paths:
      - 'mdia/quantity_reocr.py'
      - 'tests/test_quantity_reocr.py'
      - 'scripts/compare_missing_field300.py'
      - '.github/workflows/mdia-missing-quantity-300.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-ocr-300:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      MDIA_PADDLE_WORD_ALIGN: '0'
      MDIA_EVIDENCE_RECONCILIATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline Arabic OCR models and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng fonts-dejavu-core fonts-hosny-amiri
          python -m pip install -r requirements.txt
          python -m pip install 'paddlepaddle==3.2.0' 'paddleocr>=3.2,<4'
      - name: Complete regressions, geometry, and review safeguards
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -q
          python -m mdia.doctor
      - name: Run real PaddleOCR and targeted Tesseract on 50 original synthetic PDFs
        run: |
          python -u -m scripts.benchmark_invoice300 --shard ${{ matrix.shard }} --shards 6 \
            --engines paddle_arabic --output-dir results/missing_shard${{ matrix.shard }}
      - name: Require real OCR, successful pages, all 50 docs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=next(Path("results").glob("missing_shard*/results.json"))
          r=json.loads(p.read_text("utf-8"))
          assert r["status"]=="completed_real_ocr" and len(r["results"])==50
          assert not r["failure_records"]
          assert all(x["real_paddle_detected"] for x in r["results"])
          print(r["shard"],r["summary"]["paddle_arabic"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdia-missing-shard${{ matrix.shard }}
          path: results/missing_shard${{ matrix.shard }}/results.json
          retention-days: 7
          if-no-files-found: error
  compare-frozen-baseline:
    needs: real-ocr-300
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mdia-missing-shard*
          path: candidate
      - name: Original synthetic acceptance guard
        run: python -m scripts.check_invoice300_acceptance candidate/*/results.json
      - uses: actions/download-artifact@v4
        with:
          run-id: 40782283610
          github-token: ${{ github.token }}
          pattern: mdia-pre-review-shard*
          path: baseline
      - name: Strict per-field proof against 5382/5776 accepted baseline
        run: |
          python -m scripts.compare_missing_field300 \
            --previous baseline/*/results.json \
            --current candidate/*/results.json \
            --output results/missing_fields_comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdia-missing-fields-compare-proof
          path: results/missing_fields_comparison.json
          retention-days: 14
          if-no-files-found: warn
