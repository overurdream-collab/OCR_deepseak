name: MDIA table-specific PicoDet layout detector — Arabic invoice pilot
on:
  push:
    branches:
      - experiment/mdia-ai-table-model-pilot
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paddle-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing MDIA PDF requirements and Paddle local runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-hosny-amiri
          python -m pip install -r requirements.txt
          python -m pip install 'paddlepaddle==3.2.0' 'paddleocr>=3.2,<4'
      - name: Validate adapter with no model
        run: |
          python -m unittest tests.test_paddle_layout -v
      - name: Execute PicoDet table model real CPU inference on six synthetic PDFs
        run: |
          python -u -m scripts.ai_paddle_layout_pilot \
            --shard ${{ matrix.shard }} --shards 2 --model PicoDet_layout_1x_table \
            --output-dir results/paddle_layout_shard${{ matrix.shard }}
      - name: Show explicit result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path("results").glob("paddle_layout_shard*/layout_results.json"):
              d=json.loads(p.read_text())
              print("STATUS",d["status"],"SUMMARY",d["summary"])
              assert d["status"]=="completed_real_layout_pilot"
          PY
      - name: Save PDF inputs and original-page annotated results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdia-picodet-table-shard${{ matrix.shard }}
          path: results/paddle_layout_shard${{ matrix.shard }}/
          retention-days: 30
          if-no-files-found: warn
