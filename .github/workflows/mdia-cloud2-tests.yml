name: MDIA Cloud2 — CPU regression and Arabic readiness
on:
  push:
    branches:
      - feat/mdia-cloud2-fixes
  workflow_dispatch:
  pull_request:
    paths:
      - 'mdia/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/mdia-cloud2-tests.yml'
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local OCR and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara fonts-hosny-amiri fonts-dejavu-core
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run original + independent synthetic tests
        run: python -m unittest tests.test_pipeline tests.test_arabic tests.test_independent_regressions -v
      - name: Verify Arabic OCR and PDF runtime
        run: python -m mdia.doctor
