name: MDIA original PDF text quantity — independent source-only proof
on:
  pull_request:
    paths:
      - 'mdia/native_pdf_quantities.py'
      - 'mdia/pipeline.py'
      - 'tests/test_native_pdf_quantities.py'
      - 'scripts/probe_native_pdf_quantities.py'
      - '.github/workflows/mdia-native-quantity-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local PDF parser for source word evidence
        run: python -m pip install pdfplumber
      - name: Prove no invented digit, no scan changes and no wrong-row borrow
        run: python -m unittest tests.test_native_pdf_quantities -v
  actual-pdf-probe:
    needs: unit-safety
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      MDIA_PADDLE_WORD_ALIGN: '0'
      MDIA_EVIDENCE_RECONCILIATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free local OCR and native PDF source parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng fonts-dejavu-core fonts-hosny-amiri
          python -m pip install -r requirements.txt
          python -m pip install 'paddlepaddle==3.2.0' 'paddleocr>=3.2,<4'
      - name: Score six known source quantities from actual generated PDFs
        run: python -u -m scripts.probe_native_pdf_quantities
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdia-native-pdf-quantity-source-proof
          path: results/native_pdf_quantity_probe.json
          retention-days: 14
          if-no-files-found: warn
