name: MDIA evidence-first reconciliation verification
on:
  push:
    branches:
      - experiment/mdia-evidence-first-reconciliation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-hosny-amiri tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          python -m pip install -r requirements.txt
      - name: Full MDIA regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -q
          python -m mdia.doctor
      - name: Opt-in reconciliation test in actual pipeline validation
        env:
          MDIA_EVIDENCE_RECONCILIATION: '1'
        run: |
          python -m unittest tests.test_invoice_reconciliation -v
